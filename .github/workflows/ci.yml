name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend SQLite regression (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run SQLite unit and API tests
        run: python -m pytest

  backend-postgres:
    name: PostgreSQL 16 + pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: robotcare_test_ci
          POSTGRES_USER: robotcare
          POSTGRES_PASSWORD: robotcare_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robotcare -d robotcare_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ROBOTCARE_DATABASE_URL: postgresql+psycopg://robotcare:robotcare_ci_password@127.0.0.1:5432/robotcare_test_ci
      ROBOTCARE_TEST_POSTGRES_URL: postgresql+psycopg://robotcare:robotcare_ci_password@127.0.0.1:5432/robotcare_test_ci
      ROBOTCARE_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "1"
      ROBOTCARE_JWT_SECRET: ci-only-secret-not-for-deployment
      ROBOTCARE_AUTO_CREATE_SCHEMA: "false"
      ROBOTCARE_ATTACHMENT_DIR: ${{ runner.temp }}/robotcare-attachments
      ROBOTCARE_REPORT_DIR: ${{ runner.temp }}/robotcare-reports
      ROBOTCARE_DASHSCOPE_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install PostgreSQL and test dependencies
        run: python -m pip install -e ".[test,postgres]"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify database Top-K, model isolation, vector schema and HNSW index
        run: python -m pytest tests/test_postgres_integration.py -v

      - name: Run PostgreSQL and pgvector integration test
        run: python ../scripts/postgres_integration_smoke.py

  frontend:
    name: Frontend test and build (Node.js 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  frontend-e2e:
    name: Critical browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "./backend[test]"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run critical browser flows
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  deployment-config:
    name: Deployment configuration contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install static validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Run static deployment checks
        run: python scripts/verify_deployment_config.py

      - name: Resolve Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-only
          ROBOTCARE_DATABASE_URL: postgresql+psycopg://robotcare:compose-validation-only@postgres:5432/robotcare
          ROBOTCARE_JWT_SECRET: compose-validation-only-secret
        run: docker compose config --quiet

  knowledge:
    name: Knowledge data validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Parse and validate knowledge data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          knowledge_dir = Path("knowledge")

          sources_payload = json.loads(
              (knowledge_dir / "sources.json").read_text(encoding="utf-8")
          )
          flows_payload = json.loads(
              (knowledge_dir / "diagnostic_flows.json").read_text(encoding="utf-8")
          )

          sources = sources_payload.get("sources")
          flows = flows_payload.get("flows")
          if not isinstance(sources, list):
              raise TypeError("knowledge/sources.json: 'sources' must be a list")
          if not isinstance(flows, list):
              raise TypeError("knowledge/diagnostic_flows.json: 'flows' must be a list")

          eval_cases = []
          eval_path = knowledge_dir / "eval_cases.jsonl"
          for line_number, line in enumerate(
              eval_path.read_text(encoding="utf-8").splitlines(), start=1
          ):
              if not line.strip():
                  continue
              try:
                  case = json.loads(line)
              except json.JSONDecodeError as exc:
                  raise ValueError(
                      f"{eval_path}:{line_number}: invalid JSON: {exc.msg}"
                  ) from exc
              if not isinstance(case, dict):
                  raise TypeError(
                      f"{eval_path}:{line_number}: each JSONL record must be an object"
                  )
              eval_cases.append(case)

          minimums = {
              "sources": (len(sources), 4),
              "diagnostic flows": (len(flows), 4),
              "evaluation cases": (len(eval_cases), 100),
          }
          failures = [
              f"{name}: found {actual}, require at least {minimum}"
              for name, (actual, minimum) in minimums.items()
              if actual < minimum
          ]
          if failures:
              raise AssertionError("; ".join(failures))

          for name, (actual, minimum) in minimums.items():
              print(f"{name}: {actual} (minimum {minimum})")
          PY

      - name: Run offline RAG and safety dataset audit
        run: >-
          python backend/scripts/audit_eval_dataset.py
          --json-output "${RUNNER_TEMP}/rag_eval_offline_audit.json"
          --markdown-output "${RUNNER_TEMP}/rag_eval_offline_audit.md"
