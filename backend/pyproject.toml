[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robotcare-ai-backend"
version = "0.1.0"
description = "RobotCare AI deterministic diagnostic backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "langgraph>=0.4,<1",
  "python-multipart>=0.0.20,<1",
  "dashscope>=1.23,<2",
  "numpy>=2.2,<3",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "Pillow>=11,<13",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
# PostgreSQL is the only supported dialect; psycopg moved into core
# dependencies. The empty extra keeps `pip install .[postgres]` working.
postgres = []
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
