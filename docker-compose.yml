name: robotcare-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robotcare}
      POSTGRES_USER: ${POSTGRES_USER:-robotcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the external environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      robotcare_internal:
        ipv4_address: 172.30.0.30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ROBOTCARE_ENVIRONMENT: ${ROBOTCARE_ENVIRONMENT:-production}
      ROBOTCARE_REGISTRATION_MODE: ${ROBOTCARE_REGISTRATION_MODE:-invite}
      ROBOTCARE_REGISTRATION_INVITE_SECRET: ${ROBOTCARE_REGISTRATION_INVITE_SECRET:-}
      ROBOTCARE_DATABASE_URL: ${ROBOTCARE_DATABASE_URL:?Set the PostgreSQL SQLAlchemy URL in the external environment}
      # 池要按「并发聊天数 + 常规请求」估。默认 5+10 时约 15 路并发 SSE
      # 可能耗尽连接池并影响登录等常规请求。
      ROBOTCARE_DB_POOL_SIZE: ${ROBOTCARE_DB_POOL_SIZE:-20}
      ROBOTCARE_DB_MAX_OVERFLOW: ${ROBOTCARE_DB_MAX_OVERFLOW:-30}
      ROBOTCARE_DB_POOL_TIMEOUT_SECONDS: ${ROBOTCARE_DB_POOL_TIMEOUT_SECONDS:-10}
      ROBOTCARE_DB_POOL_RECYCLE_SECONDS: ${ROBOTCARE_DB_POOL_RECYCLE_SECONDS:-1800}
      ROBOTCARE_DB_POOL_PRE_PING: ${ROBOTCARE_DB_POOL_PRE_PING:-true}
      ROBOTCARE_JWT_SECRET: ${ROBOTCARE_JWT_SECRET:?Set a long random JWT secret in the external environment}
      # 与 JWT 密钥解耦：不配置时回退 JWT 密钥，届时轮换 JWT 会连带
      # 清空限流计数并让已发出的报告链接全部失效（启动日志会告警）
      ROBOTCARE_RATE_LIMIT_HMAC_SECRET: ${ROBOTCARE_RATE_LIMIT_HMAC_SECRET:-}
      ROBOTCARE_REPORT_FILENAME_SECRET: ${ROBOTCARE_REPORT_FILENAME_SECRET:-}
      ROBOTCARE_ACCESS_TOKEN_MINUTES: ${ROBOTCARE_ACCESS_TOKEN_MINUTES:-60}
      ROBOTCARE_REFRESH_TOKEN_DAYS: ${ROBOTCARE_REFRESH_TOKEN_DAYS:-14}
      ROBOTCARE_REFRESH_REUSE_GRACE_SECONDS: ${ROBOTCARE_REFRESH_REUSE_GRACE_SECONDS:-5}
      ROBOTCARE_REFRESH_COOKIE_SECURE: ${ROBOTCARE_REFRESH_COOKIE_SECURE:-true}
      ROBOTCARE_LOGIN_MAX_FAILURES: ${ROBOTCARE_LOGIN_MAX_FAILURES:-5}
      ROBOTCARE_LOGIN_EMAIL_MAX_FAILURES: ${ROBOTCARE_LOGIN_EMAIL_MAX_FAILURES:-20}
      ROBOTCARE_LOGIN_IP_MAX_FAILURES: ${ROBOTCARE_LOGIN_IP_MAX_FAILURES:-30}
      ROBOTCARE_LOGIN_WINDOW_MINUTES: ${ROBOTCARE_LOGIN_WINDOW_MINUTES:-15}
      ROBOTCARE_LOGIN_LOCK_MINUTES: ${ROBOTCARE_LOGIN_LOCK_MINUTES:-15}
      # 成功登录同样限流，防止有效凭据被用于高频签发令牌。
      ROBOTCARE_LOGIN_SUCCESS_EMAIL_PER_MINUTE: ${ROBOTCARE_LOGIN_SUCCESS_EMAIL_PER_MINUTE:-10}
      ROBOTCARE_LOGIN_SUCCESS_IP_PER_MINUTE: ${ROBOTCARE_LOGIN_SUCCESS_IP_PER_MINUTE:-30}
      ROBOTCARE_MAX_CONVERSATIONS_PER_USER: ${ROBOTCARE_MAX_CONVERSATIONS_PER_USER:-200}
      # 两层代理均需加入可信网段：
      #   172.30.0.10 = 本栈的 Nginx 容器
      #   172.30.0.1  = Compose 网络网关。前端端口只绑 127.0.0.1，对外必须靠宿主
      #     上的 TLS 反代转发，而它经 loopback 进来后源地址一律是网关。不信任这一跳，
      #     后端会把网关当成客户端，导致所有用户共享同一限流桶。
      # 信任网关的前提是端口只绑 loopback（见 frontend.ports），因此能打到这一跳的
      # 只有宿主上受控的反代进程。交叉断言见 scripts/verify_deployment_config.py。
      ROBOTCARE_TRUSTED_PROXY_CIDRS: ${ROBOTCARE_TRUSTED_PROXY_CIDRS:-172.30.0.10/32,172.30.0.1/32}
      ROBOTCARE_REGISTRATION_EMAIL_PER_MINUTE: ${ROBOTCARE_REGISTRATION_EMAIL_PER_MINUTE:-3}
      ROBOTCARE_REGISTRATION_IP_PER_MINUTE: ${ROBOTCARE_REGISTRATION_IP_PER_MINUTE:-10}
      ROBOTCARE_KNOWLEDGE_SEARCH_USER_PER_MINUTE: ${ROBOTCARE_KNOWLEDGE_SEARCH_USER_PER_MINUTE:-20}
      ROBOTCARE_KNOWLEDGE_SEARCH_IP_PER_MINUTE: ${ROBOTCARE_KNOWLEDGE_SEARCH_IP_PER_MINUTE:-60}
      ROBOTCARE_DIAGNOSTIC_CREATE_USER_PER_MINUTE: ${ROBOTCARE_DIAGNOSTIC_CREATE_USER_PER_MINUTE:-10}
      ROBOTCARE_DIAGNOSTIC_CREATE_IP_PER_MINUTE: ${ROBOTCARE_DIAGNOSTIC_CREATE_IP_PER_MINUTE:-30}
      ROBOTCARE_ATTACHMENT_UPLOAD_USER_PER_MINUTE: ${ROBOTCARE_ATTACHMENT_UPLOAD_USER_PER_MINUTE:-20}
      ROBOTCARE_ATTACHMENT_UPLOAD_IP_PER_MINUTE: ${ROBOTCARE_ATTACHMENT_UPLOAD_IP_PER_MINUTE:-60}
      ROBOTCARE_REPORT_CREATE_USER_PER_MINUTE: ${ROBOTCARE_REPORT_CREATE_USER_PER_MINUTE:-5}
      ROBOTCARE_REPORT_CREATE_IP_PER_MINUTE: ${ROBOTCARE_REPORT_CREATE_IP_PER_MINUTE:-15}
      ROBOTCARE_PDF_CREATE_USER_PER_MINUTE: ${ROBOTCARE_PDF_CREATE_USER_PER_MINUTE:-5}
      ROBOTCARE_PDF_CREATE_IP_PER_MINUTE: ${ROBOTCARE_PDF_CREATE_IP_PER_MINUTE:-15}
      ROBOTCARE_EMBEDDING_USER_PER_MINUTE: ${ROBOTCARE_EMBEDDING_USER_PER_MINUTE:-10}
      ROBOTCARE_EMBEDDING_IP_PER_MINUTE: ${ROBOTCARE_EMBEDDING_IP_PER_MINUTE:-30}
      ROBOTCARE_EMBEDDING_USER_PER_DAY: ${ROBOTCARE_EMBEDDING_USER_PER_DAY:-100}
      ROBOTCARE_EMBEDDING_IP_PER_DAY: ${ROBOTCARE_EMBEDDING_IP_PER_DAY:-300}
      ROBOTCARE_KNOWLEDGE_SEARCH_CACHE_TTL_SECONDS: ${ROBOTCARE_KNOWLEDGE_SEARCH_CACHE_TTL_SECONDS:-30}
      ROBOTCARE_KNOWLEDGE_SEARCH_CACHE_MAX_ENTRIES: ${ROBOTCARE_KNOWLEDGE_SEARCH_CACHE_MAX_ENTRIES:-512}
      ROBOTCARE_CITATION_PAGE_CACHE_MAX_ENTRIES: ${ROBOTCARE_CITATION_PAGE_CACHE_MAX_ENTRIES:-64}
      ROBOTCARE_CITATION_PAGE_CACHE_MAX_MB: ${ROBOTCARE_CITATION_PAGE_CACHE_MAX_MB:-32}
      ROBOTCARE_CITATION_PAGE_MAX_CONCURRENT: ${ROBOTCARE_CITATION_PAGE_MAX_CONCURRENT:-4}
      ROBOTCARE_READINESS_PROBE_SUCCESS_TTL_SECONDS: ${ROBOTCARE_READINESS_PROBE_SUCCESS_TTL_SECONDS:-300}
      ROBOTCARE_READINESS_PROBE_FAILURE_TTL_SECONDS: ${ROBOTCARE_READINESS_PROBE_FAILURE_TTL_SECONDS:-30}
      ROBOTCARE_CORS_ORIGINS: ${ROBOTCARE_CORS_ORIGINS:-http://localhost:5173}
      ROBOTCARE_KNOWLEDGE_ANSWER_USER_PER_MINUTE: ${ROBOTCARE_KNOWLEDGE_ANSWER_USER_PER_MINUTE:-6}
      ROBOTCARE_KNOWLEDGE_ANSWER_IP_PER_MINUTE: ${ROBOTCARE_KNOWLEDGE_ANSWER_IP_PER_MINUTE:-20}
      ROBOTCARE_ATTACHMENT_DIR: /app/data/attachments
      ROBOTCARE_REPORT_DIR: /app/data/reports
      # 知识原件存档必须落在 backend_data 卷内，否则容器重建即丢失，
      # 重新向量化/下载原件/版本回滚三项能力会一起失效
      ROBOTCARE_KNOWLEDGE_DIR: /app/data/knowledge
      ROBOTCARE_AUTO_CREATE_SCHEMA: "false"
      ROBOTCARE_DASHSCOPE_API_KEY: ${ROBOTCARE_DASHSCOPE_API_KEY:-}
      ROBOTCARE_DASHSCOPE_BASE_URL: ${ROBOTCARE_DASHSCOPE_BASE_URL:-}
      # 生成后端：不透传时容器内永远只能用 DashScope 默认值，
      # 否则 llm_backend 配置在容器中不会生效。
      ROBOTCARE_LLM_BACKEND: ${ROBOTCARE_LLM_BACKEND:-dashscope}
      ROBOTCARE_LLM_API_KEY: ${ROBOTCARE_LLM_API_KEY:-}
      ROBOTCARE_LLM_BASE_URL: ${ROBOTCARE_LLM_BASE_URL:-}
      ROBOTCARE_GENERATION_MODEL: ${ROBOTCARE_GENERATION_MODEL:-qwen-plus}
      # 后台保存的 Provider 密钥由此独立 Fernet 密钥加密；不得写进镜像。
      ROBOTCARE_AI_CONFIG_ENCRYPTION_KEY: ${ROBOTCARE_AI_CONFIG_ENCRYPTION_KEY:-}
      # 外部模型超时预算，必须小于 frontend/nginx.conf 的 proxy_read_timeout
      ROBOTCARE_LLM_CONNECT_TIMEOUT_SECONDS: ${ROBOTCARE_LLM_CONNECT_TIMEOUT_SECONDS:-5}
      ROBOTCARE_LLM_READ_TIMEOUT_SECONDS: ${ROBOTCARE_LLM_READ_TIMEOUT_SECONDS:-40}
      ROBOTCARE_LLM_BUDGET_SECONDS: ${ROBOTCARE_LLM_BUDGET_SECONDS:-50}
      ROBOTCARE_LLM_MAX_ATTEMPTS: ${ROBOTCARE_LLM_MAX_ATTEMPTS:-2}
      ROBOTCARE_EMBEDDING_CONNECT_TIMEOUT_SECONDS: ${ROBOTCARE_EMBEDDING_CONNECT_TIMEOUT_SECONDS:-5}
      ROBOTCARE_EMBEDDING_READ_TIMEOUT_SECONDS: ${ROBOTCARE_EMBEDDING_READ_TIMEOUT_SECONDS:-20}
      ROBOTCARE_EMBEDDING_BUDGET_SECONDS: ${ROBOTCARE_EMBEDDING_BUDGET_SECONDS:-30}
      ROBOTCARE_EMBEDDING_MAX_ATTEMPTS: ${ROBOTCARE_EMBEDDING_MAX_ATTEMPTS:-2}
      # token 单价（元/百万 token）。换模型必须跟着改，否则成本看板会悄悄失真
      ROBOTCARE_LLM_TOKEN_PRICES: ${ROBOTCARE_LLM_TOKEN_PRICES:-{}}
      ROBOTCARE_LLM_DEFAULT_PROMPT_PRICE_PER_MILLION: ${ROBOTCARE_LLM_DEFAULT_PROMPT_PRICE_PER_MILLION:-0.8}
      ROBOTCARE_LLM_DEFAULT_COMPLETION_PRICE_PER_MILLION: ${ROBOTCARE_LLM_DEFAULT_COMPLETION_PRICE_PER_MILLION:-2.0}
      # 告警通道：不透传时容器内 alert_webhook_url 恒为 None，
      # 否则告警通道会在容器中保持关闭。
      ROBOTCARE_ALERT_WEBHOOK_URL: ${ROBOTCARE_ALERT_WEBHOOK_URL:-}
      ROBOTCARE_ALERT_WEBHOOK_FORMAT: ${ROBOTCARE_ALERT_WEBHOOK_FORMAT:-wecom}
      ROBOTCARE_ALERT_COOLDOWN_SECONDS: ${ROBOTCARE_ALERT_COOLDOWN_SECONDS:-14400}
      ROBOTCARE_KNOWLEDGE_MIN_SCORE: ${ROBOTCARE_KNOWLEDGE_MIN_SCORE:-0.25}
      ROBOTCARE_KNOWLEDGE_MIN_SCORE_OVERRIDES: ${ROBOTCARE_KNOWLEDGE_MIN_SCORE_OVERRIDES:-{}}
      ROBOTCARE_PDF_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    ports:
      # Keep the application server off public interfaces. A host-level HTTPS
      # reverse proxy may reach it through loopback; the bundled frontend uses
      # the private Compose network.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - backend_data:/app/data
      - ${ROBOTCARE_KNOWLEDGE_RELEASE_DIR:-./knowledge/external}:/knowledge-release:ro
    networks:
      robotcare_internal:
        ipv4_address: 172.30.0.20

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok' && wget -q -O - http://backend:8000/ready | grep -q '\"status\":\"ready\"'"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      robotcare_internal:
        ipv4_address: 172.30.0.10

volumes:
  postgres_data:
  backend_data:

networks:
  robotcare_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
