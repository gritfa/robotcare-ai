server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 必须 >= 后端 MAX_KNOWLEDGE_PDF_BYTES（30MB）。定成 6m 时，运营从前端传
    # 那份 27MB 的说明书只会拿到 nginx 的 HTML 413，应用层的 JSON 错误根本
    # 到不了前端——这正是真机原件一直没进存档、「按页看原件」在真机型号上
    # 404 的根因（2026-08-06 体检 #5）。交叉断言见 verify_deployment_config.py。
    client_max_body_size 32m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 追加而不是覆盖。原来写死 $remote_addr 时，只要宿主前面再放一层 HTTPS
        # 反代（上线必然要做），容器 nginx 看到的 $remote_addr 就是那台反代，
        # 全站所有用户被覆盖成同一个值 → 共用一个限流桶 → 任意一人失败登录 30 次
        # 锁全站（2026-08-06 体检 D1）。
        # 追加不会引入伪造风险：后端 client_ip() 从右往左走链、跳过 trusted_proxy_cidrs
        # 里的可信跳，取第一个不可信地址。客户端自己塞的 XFF 只会排在链最左边，
        # 永远走不到——除非把可信网段配成公网大段，那由 verify_deployment_config 拦。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 必须大于后端流式最坏耗时（llm_budget + llm_read = 50+40）。
        # 定成 60s 时反代会先于后端的预算闸断开，用户拿到的是一个没有解释的
        # 504、而后端还在跑还在计费——那正是预算闸要消灭的失效模式（体检 #4）。
        # 交叉断言见 scripts/verify_deployment_config.py。
        proxy_read_timeout 100s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
