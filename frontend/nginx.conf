server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 必须 >= 后端 MAX_KNOWLEDGE_PDF_BYTES（30MB）。定成 6m 时，运营从前端传
    # 那份 27MB 的说明书只会拿到 nginx 的 HTML 413，应用层的 JSON 错误根本
    # 到不了前端——这正是真机原件一直没进存档、「按页看原件」在真机型号上
    # 404 的根因（2026-08-06 体检 #5）。交叉断言见 verify_deployment_config.py。
    client_max_body_size 32m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This deployment has exactly one trusted proxy hop. Overwrite a
        # caller-supplied header instead of appending attacker-controlled data.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 必须大于后端流式最坏耗时（llm_budget + llm_read = 50+40）。
        # 定成 60s 时反代会先于后端的预算闸断开，用户拿到的是一个没有解释的
        # 504、而后端还在跑还在计费——那正是预算闸要消灭的失效模式（体检 #4）。
        # 交叉断言见 scripts/verify_deployment_config.py。
        proxy_read_timeout 100s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
