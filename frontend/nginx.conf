server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 必须 >= 后端 MAX_KNOWLEDGE_PDF_BYTES（30MB）。定成 6m 时，运营从前端传
    # 那份 27MB 的说明书只会拿到 nginx 的 HTML 413，应用层的 JSON 错误根本
    # 到不了前端——这正是真机原件一直没进存档、「按页看原件」在真机型号上
    # 否则真实说明书原件可能因请求体限制返回 404。交叉检查见 verify_deployment_config.py。
    client_max_body_size 32m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 保留既有转发链并追加当前代理地址。后端从右向左移除可信代理，
        # 以第一个不可信地址作为客户端地址。部署检查同时限制可信代理网段，
        # 避免伪造转发头或所有用户共享同一限流桶。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 超时必须覆盖后端流式预算（llm_budget + llm_read = 50+40），
        # 避免代理提前返回 504，而后端请求仍继续执行和计费。
        # 交叉断言见 scripts/verify_deployment_config.py。
        proxy_read_timeout 100s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
